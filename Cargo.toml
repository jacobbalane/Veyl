[workspace]
members = ["crates/*", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The echo engine must keep up with live audio in development builds of the desktop app.
[profile.dev.package.veyl-dsp]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
