[package]
name = "veyl-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["io-util", "net", "time", "macros", "rt", "sync"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["test-util"] }
