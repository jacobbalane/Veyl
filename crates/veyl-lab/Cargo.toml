[package]
name = "veyl-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
veyl-sim = { path = "../veyl-sim" }
veyl-link = { path = "../veyl-link" }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
hound = "3.5.1"
time = { version = "0.3.55", features = ["formatting"] }
png = "0.18.1"
veyl-dsp = { path = "../veyl-dsp" }

[dev-dependencies]
tempfile = "3"
