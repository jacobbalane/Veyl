name: Build Veyl
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run format:check
      - run: node --test "scripts/*.test.mjs"
      - run: node scripts/check-version.mjs
      - run: npm run -w desktop typecheck
      - run: npm run -w desktop test
      - run: npm run -w site test
      - run: npm run -w site build
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p veyl-dsp -p veyl-link -p veyl-sim -p veyl-lab --all-targets -- -D warnings
      - run: cargo test -p veyl-link
      # Scenario and end-to-end tests run optimized so they finish in minutes.
      - run: cargo test --release -p veyl-dsp -p veyl-sim -p veyl-lab
      # Enable the shared protocol vectors after M1.3.
      # - name: Protocol test vectors are current
      #   run: |
      #     cargo run -q -p veyl-link --example gen_vectors > "$RUNNER_TEMP/v1.json"
      #     diff -u protocol/test-vectors/v1.json "$RUNNER_TEMP/v1.json"

  windows:
    needs: checks
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            msvc: x64
            name: x64
          # Cross-built on x64 with the ARM64 tools; it can't run here, so it skips clippy and tests.
          - target: aarch64-pc-windows-msvc
            msvc: amd64_arm64
            name: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      # The Tauri crate embeds the built UI, so build it before clippy and tests.
      - run: npm run -w desktop build
      - if: matrix.name == 'x64'
        run: cargo clippy -p veyl-desktop --all-targets -- -D warnings
      - if: matrix.name == 'x64'
        run: cargo test -p veyl-desktop
      - run: npm run -w desktop package -- --target ${{ matrix.target }}
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Veyl-windows-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.sha256

  android:
    needs: checks
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.VEYL_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Releases need the signing key
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::VEYL_KEYSTORE_BASE64 is not set, so the release APK can't be signed."
          exit 1
      - name: Signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          VEYL_KEYSTORE_BASE64: ${{ secrets.VEYL_KEYSTORE_BASE64 }}
        run: echo "$VEYL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/veyl-release.p12"
      - name: Build
        working-directory: android
        env:
          VEYL_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/veyl-release.p12', runner.temp) || '' }}
          VEYL_KEYSTORE_PASSWORD: ${{ secrets.VEYL_KEYSTORE_PASSWORD }}
          VEYL_KEY_ALIAS: ${{ secrets.VEYL_KEY_ALIAS }}
          VEYL_KEY_PASSWORD: ${{ secrets.VEYL_KEY_PASSWORD }}
        run: |
          if [ -n "$VEYL_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon :core:test :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease
          else
            ./gradlew --no-daemon :core:test :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
          fi
      - name: Name, verify and checksum
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Veyl_${version}.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs "out/Veyl_${version}.apk"
          (cd out && sha256sum "Veyl_${version}.apk" > "Veyl_${version}.apk.sha256")
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: Veyl-android
          path: android/out/*
      # Pull requests from forks have no secrets: keep their debug APK out of releases.
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE != 'true'
        with:
          name: debug-android
          path: android/app/build/outputs/apk/debug/*.apk

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The release records where its files came from (`gh attestation verify`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The release notes are the version's section of CHANGELOG.md, written for people.
      - run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Veyl-*
          merge-multiple: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Veyl ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          # Appends GitHub's list of changes and contributors after the changelog section.
          generate_release_notes: true
          files: artifacts/*
